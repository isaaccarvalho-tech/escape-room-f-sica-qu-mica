          const w = canvas.width, h = canvas.height;

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#090916'; ctx.fillRect(0, 0, w, h);

          // Grid
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)'; ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
          for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

          const groundY = h - 35, cliffX = 70;
          const scaleX = (w - 140) / 180, scaleY = (groundY - 50) / 125;
          const cliffTopY = groundY - simHeight * scaleY;

          // Ground
          ctx.fillStyle = '#111827'; ctx.fillRect(0, groundY, w, h - groundY);
          ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

          // Target Zone
          const tStart = cliffX + 120 * scaleX;
          const tEnd = cliffX + 145 * scaleX;
          ctx.fillStyle = 'rgba(0, 255, 102, 0.2)'; ctx.fillRect(tStart, groundY - 6, tEnd - tStart, 8);
          ctx.strokeStyle = '#00FF66'; ctx.strokeRect(tStart, groundY - 6, tEnd - tStart, 8);
          ctx.fillStyle = '#00FF66'; ctx.font = 'bold 11px IBM Plex Mono'; ctx.textAlign = 'center';
          ctx.fillText('🎯 ZONA DE RESGATE (120m - 145m)', (tStart + tEnd) / 2, groundY - 14);

          // Cliff
          ctx.fillStyle = '#111827'; ctx.strokeStyle = '#00F0FF';
          ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(cliffX, groundY); ctx.lineTo(cliffX, cliffTopY); ctx.lineTo(0, cliffTopY); ctx.closePath();
          ctx.fill(); ctx.stroke();

          // Capsule at start if not launched
          if (!simIsLaunching && !simHasLanded) {
            ctx.fillStyle = '#00F0FF'; ctx.beginPath(); ctx.arc(cliffX, cliffTopY - 6, 6, 0, Math.PI * 2); ctx.fill();
          }
        }, [showSimulator, simHeight, simVx, simGravity, simIsLaunching, simHasLanded]);

        // Launch animation
        const handleLaunch = () => {
          if (simIsLaunching) return;
          sound.playLaunch();
          setSimIsLaunching(true);
          setSimHasLanded(false);
          setSimHitTarget(false);

          const canvas = simCanvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const w = canvas.width, h = canvas.height;
          const groundY = h - 35, cliffX = 70;
          const scaleX = (w - 140) / 180, scaleY = (groundY - 50) / 125;
          const cliffTopY = groundY - simHeight * scaleY;

          const tQueda = Math.sqrt((2 * simHeight) / simGravity);
          const alcance = simVx * tQueda;
          const startTime = performance.now();
          const animDuration = 2200;
          const trail = [];

          function step(now) {
            const elapsed = (now - startTime) / animDuration;
            const t = Math.min(1, elapsed) * tQueda;
            const curX = cliffX + (simVx * t) * scaleX;
            const curY = cliffTopY + (0.5 * simGravity * t * t) * scaleY;
            trail.push({ x: curX, y: curY });

            // Re-render scene
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#090916'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)'; ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

            ctx.fillStyle = '#111827'; ctx.fillRect(0, groundY, w, h - groundY);
            ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

            const tStart = cliffX + 120 * scaleX;
            const tEnd = cliffX + 145 * scaleX;
            ctx.fillStyle = 'rgba(0, 255, 102, 0.2)'; ctx.fillRect(tStart, groundY - 6, tEnd - tStart, 8);
            ctx.strokeStyle = '#00FF66'; ctx.strokeRect(tStart, groundY - 6, tEnd - tStart, 8);
            ctx.fillStyle = '#00FF66'; ctx.font = 'bold 11px IBM Plex Mono'; ctx.textAlign = 'center';
            ctx.fillText('🎯 ZONA DE RESGATE (120m - 145m)', (tStart + tEnd) / 2, groundY - 14);

            ctx.fillStyle = '#111827'; ctx.strokeStyle = '#00F0FF';
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(cliffX, groundY); ctx.lineTo(cliffX, cliffTopY); ctx.lineTo(0, cliffTopY); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Trail
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)'; ctx.lineWidth = 2.5;
            ctx.beginPath();
            trail.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
            ctx.stroke();

            // Capsule
            ctx.fillStyle = '#00F0FF'; ctx.beginPath(); ctx.arc(curX, curY, 6, 0, Math.PI * 2); ctx.fill();

            if (elapsed < 1) {
              requestAnimationFrame(step);
            } else {
              setSimIsLaunching(false);
              setSimHasLanded(true);
              const isHit = alcance >= 120 && alcance <= 145;
              setSimHitTarget(isHit);
              sound.playImpact(isHit);
            }
          }
          requestAnimationFrame(step);
        };

        // Unlock Hint (Pista 1: -1 pt, Pista 2: -2 pts, Pista 3: -3 pts)
        const handleUnlockHint = (hIdx) => {
          if (unlockedHints[currentMissionIndex][hIdx]) return;
          const cost = hIdx + 1;
          sound.playHintUnlock();
          setScoreToast(`-${cost} PT${cost > 1 ? 'S' : ''}`);
          setTimeout(() => setScoreToast(null), 2500);

          setUnlockedHints(prev => {
            const next = prev.map((arr, i) => i === currentMissionIndex ? arr.map((u, j) => j === hIdx ? true : u) : [...arr]);
            return next;
          });
          setPenalties(prev => {
            const next = [...prev];
            next[currentMissionIndex] += cost;
            return next;
          });
          setScore(prev => prev - cost);
        };

        // Submit Mission
        const handleSubmit = () => {
          if (lockoutSeconds > 0) return;
          if (!consensusChecked) {
            sound.playError();
            setFeedbackMessage({ text: 'A Trava de Consenso é obrigatória!', isError: true });
            return;
          }

          let correct = false;
          if (currentMissionIndex === 0) {
            correct = m1Geometry === currentMission.correctGeometry && m1Polarity === currentMission.correctPolarity;
          } else if (currentMissionIndex === 1) {
            correct = m2Force === currentMission.correctForce;
          } else if (currentMissionIndex === 2) {
            correct = m3Answer === currentMission.correctAnswer;
          } else if (currentMissionIndex === 3) {
            const norm = m4Keyword.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            correct = m4Flow === currentMission.correctFlow && norm === 'equilibrio termico';
          } else if (currentMissionIndex === 4) {
            const clean = m5Nox.trim().replace(/\s+/g, '');
            const exp = currentMission.correctNox.replace(/\s+/g, '');
            correct = clean === exp || (exp.startsWith('+') && clean === exp.substring(1));
          } else if (currentMissionIndex === 5) {
            const val = parseFloat(m6Value.trim().replace(',', '.'));
            correct = !isNaN(val) && Math.abs(val - currentMission.correctValue) < 0.05;
          }

          if (correct) {
            sound.playSuccess();
            const net = Math.max(1, 5 - penalties[currentMissionIndex]);
            const newCompleted = [...completedMissions];
            newCompleted[currentMissionIndex] = true;
            setCompletedMissions(newCompleted);

            const newScores = [...missionScores];
            newScores[currentMissionIndex] = net;
            setMissionScores(newScores);
            setScore(newScores.reduce((a, b) => a + b, 0));
            setFeedbackMessage({ text: `MÓDULO ${currentMissionIndex + 1} DECIFRADO! (+${net} pts)`, isError: false });
            setConsensusChecked(false);

            if (currentMissionIndex === 4) {
              setCollectiveCodes(prev => ({ ...prev, [group.id]: NOX_MASTER_CODES[group.id] }));
            }

            if (currentMissionIndex < 5 && !newCompleted[currentMissionIndex + 1]) {
              setTimeout(() => {
                setCurrentMissionIndex(currentMissionIndex + 1);
                setConsensusChecked(false);
                setFeedbackMessage(null);
              }, 1400);
            } else if (currentMissionIndex === 5 || newCompleted.filter(Boolean).length === 6) {
              setTimeout(() => setShowCollectiveModal(true), 1600);
            }
          } else {
            sound.playError();
            setLockoutSeconds(20);
            setFeedbackMessage({ text: 'ANÁLISE INCORRETA! Protocolo Anti-Chute: travado por 20s.', isError: true });
          }
        };

        if (!isStarted) {
          return (
            <div className="relative w-screen h-screen bg-[#090D16] sci-fi-grid flex flex-col justify-between p-4 overflow-hidden select-none">
              <div className="scanline"></div>
              <div className="flex items-center justify-between border-b border-cyan-500/30 pb-2">
                <div className="flex items-center gap-3">
                  <div className="p-2 rounded-lg bg-cyan-950/80 border border-cyan-400 text-cyan-300">⚛️</div>
                  <div>
                    <h1 className="font-orbitron font-extrabold text-xl tracking-wider text-white flex items-center gap-2">
                      ESCAPE ROOM: TREINAMENTO CIENTÍFICO
                      <span className="text-xs px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 font-mono">1ª SÉRIE EM</span>
                    </h1>
                    <p className="text-xs text-slate-400 font-mono">Química & Física · Protocolo Orbital</p>
                  </div>
                </div>
                <div className="text-xs font-mono text-cyan-400 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-cyan-500/30">

                </div>
              </div>

              <div className="flex-1 grid grid-cols-12 gap-4 py-3 min-h-0">
                <div className="col-span-5 flex flex-col gap-3 min-h-0">
                  <div className="bg-slate-950/80 border border-amber-500/40 rounded-xl p-3 shadow-lg">
                    <span className="text-amber-400 font-orbitron font-bold text-xs block mb-1">⚠️ TRANSMISSÃO DA CENTRAL:</span>
                    <p className="text-xs text-slate-300 font-mono leading-relaxed">
                      "Atenção bancadas! Houve uma pane na Cápsula Orion-8. Todos os 6 módulos foram travados. Para resgatá-la, decifre os desafios de Química e Física e obtenha seu Código Mestre de Oxidação!"
                    </p>
                  </div>

                  <div className="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 flex flex-col min-h-0">
                    <span className="font-orbitron text-xs font-bold text-cyan-300 mb-2">SELECIONE A SUA BANCADA:</span>
                    <div className="grid grid-cols-2 gap-2 flex-1 overflow-y-auto custom-scrollbar pr-1">
                      {GROUPS.map(g => (
                        <button key={g.id} onClick={() => { sound.playClick(); setGroup(g); }} className={`p-2 rounded-lg border text-left flex items-center justify-between cursor-pointer ${group.id === g.id ? 'bg-cyan-950/70 border-cyan-400 ring-1 ring-cyan-400' : 'bg-slate-950/70 border-slate-800 text-slate-300'}`}>
                          <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded flex items-center justify-center font-orbitron font-bold text-xs border border-cyan-500/40 text-cyan-300 bg-cyan-950/40">{g.symbol}</div>
                            <div>
                              <div className="text-xs font-bold text-white">{g.id}</div>
                              <div className="text-[10px] text-slate-400 font-mono">{g.element}</div>
                            </div>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="col-span-7 bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between min-h-0">
                  <div>
                    <div className="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                      <span className="text-cyan-300 font-orbitron font-bold text-sm">ESCALAÇÃO DOS 4 CIENTISTAS:</span>
                      <span className="text-[11px] font-mono text-slate-400">Trabalho Cooperativo</span>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-cyan-400 font-semibold block mb-1">1. INVESTIGADOR(A)</span>
                        <input type="text" placeholder="Nome..." value={students.investigador} onChange={e => setStudents(s => ({ ...s, investigador: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono focus:outline-none" />
                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-emerald-400 font-semibold block mb-1">2. CIENTISTA DA QUÍMICA</span>
                        <input type="text" placeholder="Nome..." value={students.quimico} onChange={e => setStudents(s => ({ ...s, quimico: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono focus:outline-none" />
                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-amber-400 font-semibold block mb-1">3. CIENTISTA DA FÍSICA</span>
                        <input type="text" placeholder="Nome..." value={students.fisico} onChange={e => setStudents(s => ({ ...s, fisico: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono focus:outline-none" />
                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-rose-400 font-semibold block mb-1">4. OPERADOR(A) DA CENTRAL</span>
                        <input type="text" placeholder="Nome..." value={students.operador} onChange={e => setStudents(s => ({ ...s, operador: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono focus:outline-none" />
                      </div>
                    </div>
                  </div>

                  <button onClick={() => { sound.playSuccess(); setIsStarted(true); }} className="w-full py-3 bg-gradient-to-r from-cyan-500 via-blue-600 to-emerald-500 hover:brightness-110 text-white font-orbitron font-bold text-sm tracking-widest rounded-xl shadow-lg shadow-cyan-950 cursor-pointer">
                    INICIAR TREINAMENTO CIENTÍFICO →
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // Simulator screen
        if (showSimulator) {
          const tQueda = Math.sqrt((2 * simHeight) / simGravity);
          const alcance = simVx * tQueda;
          const vImpacto = Math.sqrt(simVx * simVx + (simGravity * tQueda) * (simGravity * tQueda));

          return (
            <div className="fixed inset-0 z-50 bg-[#090916] backdrop-blur-xl flex flex-col p-4 overflow-hidden select-none">
              <div className="flex items-center justify-between pb-3 border-b border-cyan-500/30">
                <div className="flex items-center gap-3">
                  <div className="p-2 rounded-lg bg-cyan-950/60 border border-cyan-400 text-cyan-300">🚀</div>
                  <div>
                    <h1 className="font-orbitron font-bold text-lg text-white tracking-wider">
                      SIMULADOR DE LANÇAMENTO HORIZONTAL <span className="text-xs px-2 py-0.5 rounded bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-mono">FASE FINAL</span>
                    </h1>
                    <p className="text-xs text-slate-400 font-mono">Bancada: <span className="text-cyan-300">{group.name}</span></p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {simHasLanded && simHitTarget && (
                    <button onClick={() => setSimShowCertificate(true)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-orbitron font-bold rounded shadow-lg">
                      VER CERTIFICADO
                    </button>
                  )}
                  <button onClick={() => setShowSimulator(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-mono rounded border border-slate-700">
                    VOLTAR AO DASHBOARD
                  </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col gap-3 py-2 min-h-0">
                <div className="flex-1 min-h-0 relative bg-[#090916] rounded-xl border border-cyan-500/40 overflow-hidden shadow-2xl flex items-center justify-center">
                  <canvas ref={simCanvasRef} width={980} height={360} className="w-full h-full object-contain"></canvas>
                  <div className="absolute top-3 left-3 bg-[#090916]/90 border border-cyan-500/40 p-3 rounded-lg text-xs font-mono backdrop-blur-md flex flex-col gap-1.5 pointer-events-none shadow-lg">
                    <span className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">CÁLCULOS AUTOMÁTICOS</span>
                    <div className="text-slate-300">Tempo de Queda: <span className="text-cyan-300 font-bold font-mono">{tQueda.toFixed(2)} s</span></div>
                    <div className="text-slate-300">Alcance Horizontal: <span className="text-[#00FF66] font-bold font-mono">{alcance.toFixed(1)} m</span></div>
                    <div className="text-slate-300">Velocidade Impacto: <span className="text-amber-300 font-bold font-mono">{vImpacto.toFixed(1)} m/s</span></div>
                  </div>

                  {simHasLanded && (
                    <div className={`absolute top-3 right-3 px-3 py-2 rounded-lg font-orbitron text-xs font-bold border backdrop-blur-md ${simHitTarget ? 'bg-emerald-950/90 border-[#00FF66] text-[#00FF66]' : 'bg-rose-950/90 border-[#FF3366] text-[#FF3366]'}`}>
                      {simHitTarget ? `🎯 ALVO ATINGIDO COM SUCESSO! (${alcance.toFixed(1)} m)` : `⚠️ FORA DO ALVO (${alcance.toFixed(1)} m)! AJUSTE h OU Vx.`}
                    </div>
                  )}
                </div>

                <div className="bg-slate-900/80 border border-slate-700/70 rounded-xl p-3.5 flex items-center justify-between gap-6">
                  <div className="flex-1 flex flex-col gap-1">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-slate-300">ALTURA DA PLATAFORMA (h):</span>
                      <span className="font-bold text-[#00F0FF]">{simHeight} metros</span>
                    </div>
                    <input type="range" min="20" max="120" step="5" value={simHeight} disabled={simIsLaunching} onChange={e => setSimHeight(Number(e.target.value))} className="accent-[#00F0FF] cursor-pointer h-2 bg-slate-800 rounded-lg" />
                  </div>

                  <div className="flex-1 flex flex-col gap-1">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-slate-300">VELOCIDADE HORIZONTAL (Vx):</span>
                      <span className="font-bold text-[#00FF66]">{simVx} m/s</span>
                    </div>
                    <input type="range" min="10" max="70" step="2" value={simVx} disabled={simIsLaunching} onChange={e => setSimVx(Number(e.target.value))} className="accent-[#00FF66] cursor-pointer h-2 bg-slate-800 rounded-lg" />
                  </div>

                  <div className="flex flex-col gap-1 w-36">
                    <span className="text-[11px] font-mono text-slate-400">GRAVIDADE (g):</span>
                    <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded border border-slate-800">
                      <button onClick={() => setSimGravity(10)} className={`py-1 text-xs font-mono font-bold rounded ${simGravity === 10 ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>10 m/s²</button>
                      <button onClick={() => setSimGravity(9.8)} className={`py-1 text-xs font-mono font-bold rounded ${simGravity === 9.8 ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>9.8 m/s²</button>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button onClick={handleLaunch} disabled={simIsLaunching} className="px-6 py-3 bg-[#00F0FF] hover:bg-cyan-300 text-slate-950 font-orbitron font-extrabold text-xs tracking-wider rounded-lg shadow-[0_0_20px_rgba(0,240,255,0.4)] cursor-pointer">
                      ▶ DISPARAR
                    </button>
                  </div>
                </div>
              </div>

              {simShowCertificate && (
                <div className="fixed inset-0 z-60 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="max-w-xl w-full bg-slate-950 border-2 border-cyan-400 rounded-2xl p-6 shadow-2xl text-center">
                    <div className="text-4xl mb-2">🏆</div>
                    <h2 className="font-orbitron font-extrabold text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-amber-300 to-emerald-400 tracking-wider">CERTIFICADO DE RECUPERAÇÃO ORBITAL</h2>
                    <p className="text-xs font-mono text-cyan-300 mt-1">MISSÃO CONCLUÍDA COM SUCESSO</p>
                    <div className="my-4 p-4 rounded-xl bg-slate-900 border border-slate-800 text-left font-mono text-xs flex flex-col gap-2">
                      <div className="text-slate-300">Equipe: <span className="font-bold text-white">{group.name}</span> · Alcance: <span className="text-emerald-400 font-bold">{alcance.toFixed(1)} m</span></div>
                      <div className="border-t border-slate-800 pt-2 grid grid-cols-2 gap-2 text-slate-400">
                        <div>Investigador(a): <span className="text-cyan-300 font-bold">{students.investigador || 'Investigador'}</span></div>
                        <div>Químico(a): <span className="text-cyan-300 font-bold">{students.quimico || 'Químico(a)'}</span></div>
                        <div>Físico(a): <span className="text-cyan-300 font-bold">{students.fisico || 'Físico(a)'}</span></div>
                        <div>Operador(a): <span className="text-cyan-300 font-bold">{students.operador || 'Operador(a)'}</span></div>
                      </div>
                    </div>
                    <button onClick={() => setSimShowCertificate(false)} className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-orbitron font-bold text-xs rounded-lg cursor-pointer">CONTINUAR</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Main Dashboard View
        return (
          <div className="relative w-screen h-screen bg-[#090D16] sci-fi-grid flex flex-col overflow-hidden select-none text-slate-100">
            <div className="scanline"></div>

            <header className="h-12 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-20">
              <div className="flex items-center gap-3">
                <div className="w-7 h-7 rounded flex items-center justify-center font-orbitron font-bold text-xs border border-cyan-400 bg-cyan-950/30 text-cyan-300">
                  {group.symbol}
                </div>
                <span className="font-orbitron font-bold text-xs text-white tracking-wider">
                  {group.name.toUpperCase()} <span className="text-[10px] text-cyan-400 font-mono font-normal">· BANCADA CIENTÍFICA</span>
                </span>
              </div>

                      <div className="flex flex-col gap-2">
                        <input type="text" placeholder="Buscar (ex: O, H, 16)..." value={refSearch} onChange={e => setRefSearch(e.target.value)} className="w-full px-2 py-1 text-xs bg-slate-950 border border-slate-700 rounded text-slate-200 font-mono focus:outline-none" />
                        <div className="grid grid-cols-2 gap-1.5">
                          {PERIODIC_ELEMENTS.filter(e => e.name.toLowerCase().includes(refSearch.toLowerCase()) || e.symbol.toLowerCase().includes(refSearch.toLowerCase()) || e.z.toString() === refSearch.trim()).map(el => (
                            <div key={el.z} className="bg-slate-950/80 border border-slate-800 p-1.5 rounded flex justify-between items-center">
                              <div className="flex items-center gap-1.5">
                                <div className="w-6 h-6 rounded bg-slate-900 border border-slate-700 flex items-center justify-center font-bold text-xs text-cyan-300">{el.symbol}</div>
                                <div><div className="text-[11px] font-bold text-slate-200 truncate max-w-[65px]">{el.name}</div><div className="text-[9px] text-slate-500">{el.group}</div></div>
                              </div>
                              <span className="text-xs text-amber-300 font-mono font-bold">{el.mass}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {refTab === 'formulas' && (
                      <div className="flex flex-col gap-2">
                        {FORMULAS_DATA.map(cat => (
                          <div key={cat.cat} className="bg-slate-950/70 border border-slate-800 rounded p-2">
                            <span className="text-[11px] font-orbitron font-bold text-cyan-400 block mb-1">{cat.cat}</span>
                            {cat.items.map(it => (
                              <div key={it.name} className="mb-1 text-xs"><span className="text-slate-400 text-[10px]">{it.name}: </span><div className="font-mono text-emerald-300 bg-slate-900 px-1 py-0.5 rounded mt-0.5">{it.form}</div></div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}
                    {refTab === 'nox' && (
                      <div className="flex flex-col gap-1.5">
                        <div className="text-[10px] text-cyan-300 bg-cyan-950/30 border border-cyan-800/40 p-2 rounded font-mono">💡 A soma dos NOX em espécie neutra é sempre ZERO!</div>
                        {NOX_RULES.map(r => (
                          <div key={r.rule} className="bg-slate-950/70 border border-slate-800 p-1.5 rounded flex justify-between"><span className="text-xs text-slate-200">${r.rule}</span><span className="text-xs font-mono text-cyan-300 bg-slate-900 px-1.5 rounded">{r.val}</span></div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </aside>
            </main>

            {/* Collective Unlock Modal */}
            {showCollectiveModal && (
              <div className="fixed inset-0 z-50 bg-[#090D16]/95 backdrop-blur-xl flex items-center justify-center p-4 select-none">
                <div className="max-w-2xl w-full bg-slate-950 border-2 border-cyan-500/60 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
                  <div className="flex justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="font-orbitron font-extrabold text-lg text-white">DESBLOQUEIO COLETIVO ORBITAL</h2>
                      <p className="text-xs text-slate-400 font-mono">Sincronização dos Códigos Mestres de Oxidação (NOX)</p>
                    </div>
                    <button onClick={() => setShowCollectiveModal(false)} className="text-xs text-slate-400 hover:text-white font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-700">Fechar</button>
                  </div>

                  <div className="bg-gradient-to-r from-cyan-950/50 via-slate-900/60 to-cyan-950/50 border border-cyan-500/40 rounded-xl p-3 text-center">
                    <span className="text-[11px] font-mono uppercase text-cyan-400 block mb-1">CÓDIGO MESTRE DA SUA EQUIPE ({group.name}):</span>
                    <div className="font-orbitron font-black text-3xl text-cyan-300">{NOX_MASTER_CODES[group.id]}</div>
                    <span className="text-[10px] text-slate-400 font-mono mt-1 block">Compartilhe este código na lousa com as outras turmas!</span>
                  </div>

                  <div>
                    <div className="flex justify-between text-xs font-mono text-slate-300 mb-2">
                      <span>CÓDIGOS DAS OUTRAS BANCADAS:</span>
                      <button onClick={() => { sound.playClick(); setCollectiveCodes({ ...NOX_MASTER_CODES }); setCollectiveError(null); }} className="text-[10px] text-cyan-400 underline cursor-pointer">✨ Sincronizar Códigos da Lousa (G1 a G8)</button>
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                      {GROUPS.map(g => (
                        <div key={g.id} className={`p-2 rounded-lg border ${g.id === group.id ? 'bg-cyan-950/40 border-cyan-400 shadow-[0_0_10px_rgba(0,240,255,0.15)]' : 'bg-slate-900/80 border-slate-800'}`}>
                          <div className="flex justify-between text-[11px] font-mono"><span className="font-bold text-slate-200">{g.id}</span><span className="text-slate-400 text-[10px]">{g.element}</span></div>
                          <input type="text" placeholder="NOX" value={collectiveCodes[g.id] || ''} onChange={e => setCollectiveCodes(c => ({ ...c, [g.id]: e.target.value }))} className={`w-full text-center py-1 font-mono font-bold text-sm rounded bg-slate-950 border ${g.id === group.id ? 'border-cyan-400 text-cyan-300' : 'border-slate-700 text-slate-100'} focus:outline-none`} />
                        </div>
                      ))}
                    </div>
                  </div>

                  {collectiveError && <div className="bg-rose-950/70 border border-rose-500/60 rounded-lg p-2.5 text-rose-300 text-xs font-mono">⚠️ {collectiveError}</div>}

                  <button onClick={() => {
                    sound.playClick();
                    let err = false;
                    for (let gid of Object.keys(NOX_MASTER_CODES)) {
                      let uVal = (collectiveCodes[gid] || '').trim().replace(/\s+/g, '');
                      if (!uVal.startsWith('+') && !uVal.startsWith('-') && !isNaN(Number(uVal)) && Number(uVal) > 0) uVal = `+${uVal}`;
                      if (uVal !== NOX_MASTER_CODES[gid]) { err = true; break; }
                    }
                    if (!err) {
                      sound.playSuccess();
                      setShowCollectiveModal(false);
                      setShowSimulator(true);
                    } else {
                      sound.playError();
                      setCollectiveError('Alguns códigos não conferem com o protocolo.');
                    }
                  }} className="w-full py-3 bg-gradient-to-r from-cyan-500 via-blue-600 to-emerald-500 hover:brightness-110 text-white font-orbitron font-extrabold text-sm tracking-wider rounded-xl shadow-lg shadow-cyan-950 cursor-pointer">
                    AUTORIZAR ACESSO AO SIMULADOR DE LANÇAMENTO →
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Render React 18 Application Root
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

              gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.08);

              gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.35);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(this.ctx.currentTime + i * 0.08); osc.stop(this.ctx.currentTime + i * 0.08 + 0.4);
            });

        playError() {
          if (!this.enabled) return;
          try {
            this.init(); if (!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);

        playHintUnlock() {
          if (!this.enabled) return;
          try {
            this.init(); if (!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
            osc.connect(gain); gain.connect(this.ctx.destination);

        playLaunch() {
          if (!this.enabled) return;
          try {
            this.init(); if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * 1.5;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, this.ctx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(1500, this.ctx.currentTime + 0.5);

            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.05, this.ctx.currentTime);

            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.4);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);

        // Disparo e animação da trajetória no Canvas + validação das Mini-Missões

          const canvas = simCanvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const w = canvas.width, h = canvas.height;
          const groundY = h - 35, cliffX = 70;
          const scaleX = (w - 130) / 195, scaleY = (groundY - 45) / 125;
          const cliffTopY = groundY - simHeight * scaleY;

          const tQueda = Math.sqrt((2 * simHeight) / simGravity);
          const alcance = simVx * tQueda;
          const startTime = performance.now();
          const animDuration = 2000;
          const trail = [];

          function step(now) {
            const elapsed = (now - startTime) / animDuration;
            const t = Math.min(1, elapsed) * tQueda;
            const curX = cliffX + (simVx * t) * scaleX;
            const curY = cliffTopY + (0.5 * simGravity * t * t) * scaleY;
            trail.push({ x: curX, y: curY });

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#090916'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)'; ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

            ctx.fillStyle = '#111827'; ctx.fillRect(0, groundY, w, h - groundY);
            ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

            ctx.fillStyle = '#64748B'; ctx.font = '10px IBM Plex Mono'; ctx.textAlign = 'center';
            for (let dist = 0; dist <= 180; dist += 20) {
              const dx = cliffX + dist * scaleX;
              ctx.beginPath(); ctx.moveTo(dx, groundY); ctx.lineTo(dx, groundY + 5); ctx.stroke();
              ctx.fillText(`${dist}m`, dx, groundY + 18);
            }

            const activeTrain = SIMULATOR_TRAINING_MISSIONS[activeSimMissionIdx];
            if (activeTrain && activeTrain.targetRange) {
              const [rMin, rMax] = activeTrain.targetRange;
              const tStart = cliffX + rMin * scaleX;
              const tEnd = cliffX + rMax * scaleX;
              ctx.fillStyle = 'rgba(0, 255, 102, 0.25)';
              ctx.fillRect(tStart, groundY - 8, Math.max(8, tEnd - tStart), 10);
              ctx.strokeStyle = '#00FF66';
              ctx.strokeRect(tStart, groundY - 8, Math.max(8, tEnd - tStart), 10);
              ctx.fillStyle = '#00FF66'; ctx.font = 'bold 11px IBM Plex Mono'; ctx.textAlign = 'center';
              ctx.fillText(`🎯 ALVO ATIVO (${rMin}m - ${rMax}m)`, (tStart + tEnd) / 2, groundY - 14);
            }

            ctx.fillStyle = '#1E293B'; ctx.strokeStyle = '#00F0FF';
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(cliffX, groundY); ctx.lineTo(cliffX, cliffTopY); ctx.lineTo(0, cliffTopY); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Trajetória parabólica
            ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2.5;
            ctx.beginPath();
            trail.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
            ctx.stroke();

            // Cápsula em voo
            ctx.fillStyle = '#00F0FF';
            ctx.beginPath(); ctx.arc(curX, curY, 6, 0, Math.PI * 2); ctx.fill();

            if (elapsed < 1) {
              requestAnimationFrame(step);
            } else {
              setSimIsLaunching(false);
              setSimHasLanded(true);

              // Verifica se cumpriu a Mini-Missão ativa ou outras mini-missões
              const currentTrain = SIMULATOR_TRAINING_MISSIONS[activeSimMissionIdx];
              const passedCurrent = currentTrain.check(simHeight, simVx, simGravity, tQueda, alcance);

              setCompletedSimMissions(prev => {
                const updated = [...prev];
                SIMULATOR_TRAINING_MISSIONS.forEach((tm, idx) => {
                  if (tm.check(simHeight, simVx, simGravity, tQueda, alcance)) {
                    updated[idx] = true;
                  }
                });
                return updated;
              });

              setSimHitTarget(passedCurrent);
              sound.playImpact(passedCurrent);

              if (passedCurrent) {
                setSimFeedbackBanner({
                  ok: true,
                  msg: `✓ ${currentTrain.title} CONCLUÍDO! (t = ${tQueda.toFixed(2)}s | Alcance = ${alcance.toFixed(1)}m)`
                });
                if (activeSimMissionIdx < SIMULATOR_TRAINING_MISSIONS.length - 1) {
                  setTimeout(() => setActiveSimMissionIdx(prev => Math.min(SIMULATOR_TRAINING_MISSIONS.length - 1, prev + 1)), 1800);
                }
              } else {
                setSimFeedbackBanner({
                  ok: false,
                  msg: `Disparo registrado: t = ${tQueda.toFixed(2)}s e Alcance = ${alcance.toFixed(1)}m. Ajuste h, Vx ou g para cumprir o objetivo do ${currentTrain.title}!`
                });
              }
            }
          }
          requestAnimationFrame(step);
        };

        // Desbloqueio de Pistas (Pista 1: -1 pt, Pista 2: -2 pts, Pista 3: -3 pts)
        const handleUnlockHint = (hIdx) => {
          if (unlockedHints[currentMissionIndex][hIdx]) return;
          const cost = hIdx + 1;
          sound.playHintUnlock();
          setScoreToast(`-${cost} PT${cost > 1 ? 'S' : ''}`);
          setTimeout(() => setScoreToast(null), 2500);

          setUnlockedHints(prev => prev.map((arr, i) => i === currentMissionIndex ? arr.map((u, j) => j === hIdx ? true : u) : [...arr]));
          setPenalties(prev => {
            const next = [...prev];
            next[currentMissionIndex] += cost;
            return next;
          });
          setScore(prev => prev - cost);
        };

        // Validação e Envio de Resposta da Missão Ativa
        const handleSubmit = () => {
          if (lockoutSeconds > 0) return;
          if (!consensusChecked) {
            sound.playError();
            setFeedbackMessage({ text: 'A Trava de Consenso dos 4 cientistas é obrigatória antes do envio!', isError: true });
            return;
          }

          let correct = false;
          if (currentMissionIndex === 0) {
            correct = m1Geometry === currentMission.correctGeometry && m1Polarity === currentMission.correctPolarity;
          } else if (currentMissionIndex === 1) {
            correct = m2Force === currentMission.correctForce;
          } else if (currentMissionIndex === 2) {
            const numVal = parseFloat(m3Numeric.trim().replace(',', '.'));
            correct = m3Behavior === currentMission.correctBehavior && !isNaN(numVal) && Math.abs(numVal - currentMission.correctNumeric) < 0.05;
          } else if (currentMissionIndex === 3) {
            const numVal = parseFloat(m4Numeric.trim().replace(',', '.'));
            correct = m4Flow === currentMission.correctFlow && !isNaN(numVal) && Math.abs(numVal - currentMission.correctNumeric) < 0.05;
          } else if (currentMissionIndex === 4) {
            const clean = m5Nox.trim().replace(/\s+/g, '');
            const exp = currentMission.correctNox.replace(/\s+/g, '');
            correct = clean === exp || (exp.startsWith('+') && clean === exp.substring(1));
          } else if (currentMissionIndex === 5) {
            const val = parseFloat(m6Value.trim().replace(',', '.'));
            correct = !isNaN(val) && Math.abs(val - currentMission.correctValue) < 0.05;
          }

          if (correct) {
            sound.playSuccess();
            const net = Math.max(1, 5 - penalties[currentMissionIndex]);
            const newCompleted = [...completedMissions];
            newCompleted[currentMissionIndex] = true;
            setCompletedMissions(newCompleted);

            const newScores = [...missionScores];
            newScores[currentMissionIndex] = net;
            setMissionScores(newScores);
            const totalPenaltiesOther = penalties.reduce((acc, p, idx) => newCompleted[idx] ? acc : acc + p, 0);
            setScore(newScores.reduce((a, b) => a + b, 0) - totalPenaltiesOther);

            setFeedbackMessage({ text: `MÓDULO ${currentMissionIndex + 1} DECIFRADO COM SUCESSO! (+${net} pts)`, isError: false });
            setConsensusChecked(false);

            if (currentMissionIndex === 4) {
              setCollectiveCodes(prev => ({ ...prev, [group.id]: NOX_MASTER_CODES[group.id] }));
            }

            if (currentMissionIndex < 5 && !newCompleted[currentMissionIndex + 1]) {
              setTimeout(() => {
                setCurrentMissionIndex(currentMissionIndex + 1);
                setConsensusChecked(false);
                setFeedbackMessage(null);
              }, 1400);
            } else if (newCompleted.every(Boolean)) {
              setTimeout(() => setShowCollectiveModal(true), 1500);
            }
          } else {
            sound.playError();
            setLockoutSeconds(20);
            setFeedbackMessage({ text: 'RESPOSTA INCORRETA! Protocolo Anti-Chute acionado: aguarde 20s e revise com o grupo.', isError: true });
          }
        };

        // Tela Inicial de Login da Bancada
        if (!isStarted) {
          return (
            <div className="relative w-screen h-screen bg-[#090D16] sci-fi-grid flex flex-col justify-between p-4 overflow-hidden select-none">
              <div className="scanline"></div>
              <div className="flex items-center justify-between border-b border-cyan-500/30 pb-2">
                <div className="flex items-center gap-3">
                  <div className="p-2 rounded-lg bg-cyan-950/80 border border-cyan-400 text-cyan-300">⚛️</div>
                  <div>
                    <h1 className="font-orbitron font-extrabold text-xl tracking-wider text-white flex items-center gap-2">
                      ESCAPE ROOM: TREINAMENTO CIENTÍFICO
                      <span className="text-xs px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 font-mono">1ª SÉRIE EM</span>
                    </h1>
                    <p className="text-xs text-slate-400 font-mono">Química & Física · Missões Exclusivas por Bancada</p>
                  </div>
                </div>
                <div className="text-xs font-mono text-cyan-400 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-cyan-500/30">
                  ESTAÇÃO ORION-8
                </div>
              </div>

              <div className="flex-1 grid grid-cols-12 gap-4 py-3 min-h-0">
                <div className="col-span-5 flex flex-col gap-3 min-h-0">
                  <div className="bg-slate-950/80 border border-amber-500/40 rounded-xl p-3 shadow-lg">

                    <p className="text-xs text-slate-300 font-mono leading-relaxed">
                      "Atenção bancadas! Cada grupo (G1 a G8) recebeu parâmetros criptografados exclusivos e aleatórios. Concluam os 6 módulos da sua bancada para revelar seu Código Mestre de Oxidação. O Simulador de Lançamento só será liberado quando todas as 8 equipes apresentarem seus códigos corretos!"

                  <div className="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 flex flex-col min-h-0">

                            <div className="w-8 h-8 rounded flex items-center justify-center font-orbitron font-bold text-xs border border-cyan-500/40 text-cyan-300 bg-cyan-950/40">{g.symbol}</div>

                        </button>

                  </div>
                </div>

                <div className="col-span-7 bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between min-h-0">

                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">

                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-emerald-400 font-semibold block mb-1">2. CIENTISTA DA QUÍMICA</span>

                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">

                      <div className="p-2.5 rounded-lg bg-slate-950/70 border border-slate-800">
                        <span className="text-xs font-mono text-rose-400 font-semibold block mb-1">4. OPERADOR(A) DA CENTRAL</span>

                      </div>
                    </div>
                  </div>

                  <button onClick={() => { sound.playSuccess(); setIsStarted(true); }} className="w-full py-3 bg-gradient-to-r from-cyan-500 via-blue-600 to-emerald-500 hover:brightness-110 text-white font-orbitron font-bold text-sm tracking-widest rounded-xl shadow-lg shadow-cyan-950 cursor-pointer">
                    INICIAR TREINAMENTO CIENTÍFICO →
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // Tela do Simulador de Lançamento Horizontal (Somente acessível após desbloqueio coletivo)
        if (showSimulator && simulatorUnlocked) {
          const tQueda = Math.sqrt((2 * simHeight) / simGravity);
          const alcance = simVx * tQueda;
          const vImpacto = Math.sqrt(simVx * simVx + (simGravity * tQueda) * (simGravity * tQueda));
          const allSimDone = completedSimMissions.every(Boolean);

          return (
            <div className="fixed inset-0 z-50 bg-[#090916] backdrop-blur-xl flex flex-col p-3.5 overflow-hidden select-none">
              <div className="flex items-center justify-between pb-2.5 border-b border-cyan-500/30 shrink-0">
                <div className="flex items-center gap-3">
                  <div className="p-1.5 rounded-lg bg-cyan-950/60 border border-cyan-400 text-cyan-300">🚀</div>
                  <div>
                    <h1 className="font-orbitron font-bold text-base text-white tracking-wider flex items-center gap-2">
                      SIMULADOR DE LANÇAMENTO HORIZONTAL
                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 border border-[#00FF66]/50 text-[#00FF66] font-mono">TREINAMENTO PARA O JOGO 2</span>
                    </h1>
                    <p className="text-[11px] text-slate-400 font-mono">Bancada: <span className="text-cyan-300">{group.name}</span> · Mini-Missões Concluídas: <span className="text-[#00FF66] font-bold">{completedSimMissions.filter(Boolean).length}/4</span></p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => { sound.playClick(); setSimShowTutorial(t => !t); }} className={`px-3 py-1.5 text-xs font-orbitron font-bold rounded border cursor-pointer ${simShowTutorial ? 'bg-cyan-500/20 border-[#00F0FF] text-[#00F0FF]' : 'bg-slate-900 border-slate-700 text-slate-300'}`}>
                    📘 {simShowTutorial ? 'OCULTAR TUTORIAL' : 'ABRIR TUTORIAL DE BALÍSTICA'}
                  </button>
                  {allSimDone && (
                    <button onClick={() => { sound.playSuccess(); setSimShowCertificate(true); }} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-orbitron font-bold rounded shadow-lg cursor-pointer animate-pulse">
                      🏆 CREDENCIAL DO JOGO 2
                    </button>
                  )}
                  <button onClick={() => setShowSimulator(false)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono rounded border border-slate-700 cursor-pointer">
                    VOLTAR AO DASHBOARD
                  </button>
                </div>
              </div>

              <div className="flex-1 grid grid-cols-12 gap-3 py-2.5 min-h-0 overflow-hidden">
                {/* Coluna Esquerda do Simulador: Tutorial e Mini-Missões de Preparação para o Jogo 2 */}
                <aside className="col-span-4 flex flex-col gap-2.5 min-h-0 overflow-y-auto custom-scrollbar pr-1">
                  {simShowTutorial && (
                    <div className="bg-slate-900/90 border border-[#00F0FF]/50 rounded-xl p-3 shadow-lg shrink-0">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-2">
                        <span className="font-orbitron font-bold text-xs text-[#00F0FF]">📘 TUTORIAL RÁPIDO: FÍSICA DO LANÇAMENTO</span>
                        <span className="text-[10px] font-mono text-amber-300">Base para o Jogo 2</span>
                      </div>
                      <div className="flex flex-col gap-2 text-[11px] font-mono text-slate-300 leading-relaxed">
                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800">
                          <strong className="text-cyan-300 block">1. Eixo Vertical (Queda Livre):</strong>
                          O tempo que a cápsula permanece no ar depende <u>apenas da Altura (h) e da Gravidade (g)</u>:
                          <div className="text-[#00F0FF] font-bold mt-0.5">t_queda = √(2·h / g)</div>
                        </div>
                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800">
                          <strong className="text-[#00FF66] block">2. Eixo Horizontal (Velocidade Constante):</strong>
                          A distância horizontal percorrida (Alcance) é o produto da Velocidade Horizontal (Vx) pelo tempo de queda:
                          <div className="text-[#00FF66] font-bold mt-0.5">Alcance = Vx · t_queda</div>
                        </div>
                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800">
                          <strong className="text-amber-300 block">3. Segredo Tático para o Jogo 2:</strong>
                          Mudar Vx <u>nunca</u> altera o tempo de queda! Primeiro regule a altura h para controlar o tempo no ar, e depois calibre Vx para cravar o alcance desejado.
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3 flex-1 flex flex-col gap-2 min-h-0">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-1.5">
                      <span className="font-orbitron font-bold text-xs text-[#00FF66]">🎯 MISSÕES DE PREPARAÇÃO (JOGO 2)</span>
                      <span className="text-[10px] font-mono text-slate-400">Clique para selecionar</span>
                    </div>

                    <div className="flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar pr-1">
                      {SIMULATOR_TRAINING_MISSIONS.map((tm, idx) => {
                        const isDone = completedSimMissions[idx];
                        const isSelected = activeSimMissionIdx === idx;
                        const isHintOpen = openSimHintIdx === idx;
                        return (
                          <div key={tm.id} onClick={() => { sound.playClick(); setActiveSimMissionIdx(idx); }} className={`p-2.5 rounded-lg border transition-all cursor-pointer ${isDone ? 'bg-emerald-950/30 border-[#00FF66]/60' : isSelected ? 'bg-cyan-950/40 border-[#00F0FF]' : 'bg-slate-950/70 border-slate-800 hover:border-slate-700'}`}>
                            <div className="flex items-center justify-between mb-1">
                              <span className={`font-orbitron font-bold text-xs ${isDone ? 'text-[#00FF66]' : isSelected ? 'text-[#00F0FF]' : 'text-slate-200'}`}>
                                {isDone ? '✓ ' : `${idx + 1}. `}{tm.title}
                              </span>
                              <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded font-bold ${isDone ? 'bg-emerald-950 text-[#00FF66] border border-[#00FF66]/40' : isSelected ? 'bg-cyan-950 text-[#00F0FF] border border-[#00F0FF]/40' : 'bg-slate-900 text-slate-400'}`}>

                          </div>

                      })}
                    </div>
                  </div>
                </aside>

                {/* Coluna Direita do Simulador: Canvas Interativo e Controles de Disparo */}
                <section className="col-span-8 flex flex-col gap-2.5 min-h-0">

                      <span className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">TELEMETRIA EM TEMPO REAL</span>

                    {simFeedbackBanner && (
                      <div className={`absolute top-3 right-3 max-w-sm px-3 py-2 rounded-lg font-mono text-xs font-bold border backdrop-blur-md shadow-lg ${simFeedbackBanner.ok ? 'bg-emerald-950/95 border-[#00FF66] text-[#00FF66]' : 'bg-rose-950/95 border-[#FF3366] text-rose-200'}`}>

                      <input type="range" min="20" max="125" step="5" value={simHeight} disabled={simIsLaunching} onChange={e => setSimHeight(Number(e.target.value))} className="accent-[#00F0FF] cursor-pointer h-2 bg-slate-800 rounded-lg" />

                      <input type="range" min="10" max="60" step="1" value={simVx} disabled={simIsLaunching} onChange={e => setSimVx(Number(e.target.value))} className="accent-[#00FF66] cursor-pointer h-2 bg-slate-800 rounded-lg" />
                    </div>

                    <div className="flex flex-col gap-1 w-36">
                      <span className="text-[11px] font-mono text-slate-400">GRAVIDADE (g):</span>
                      <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded border border-slate-800">

                      const hText = currentMission.hints[hIdx];
                      return (
                        <div key={hIdx} onClick={() => handleUnlockHint(hIdx)} className={`p-2.5 rounded-lg border font-mono transition-all ${isUnlocked ? 'bg-slate-950/95 border-[#00FF66]/60 text-slate-200 shadow-[0_0_10px_rgba(0,255,102,0.15)]' : 'bg-slate-950/70 border-[#FF3366]/40 hover:border-[#FF3366] text-slate-400 cursor-pointer active:scale-[0.99]'}`}>
                          <div className="flex justify-between items-center mb-1">
                            <span className={`font-orbitron font-bold text-xs ${isUnlocked ? 'text-[#00FF66]' : 'text-slate-200'}`}>{isUnlocked ? '🔓 ' : '🔒 '}{hTitle}</span>
                            <span className={`text-[10px] font-bold ${isUnlocked ? 'text-[#00FF66] bg-emerald-950/80 border border-[#00FF66]/50' : 'text-[#FF3366] bg-rose-950/80 border border-[#FF3366]/50'} px-2 py-0.5 rounded`}>
                              {isUnlocked ? 'REVELADA' : 'REVELAR PISTA'}
                            </span>
                          </div>
                          {isUnlocked ? (
                            <div className="text-[11px] text-[#00F0FF] leading-relaxed bg-slate-900/90 p-2 rounded border border-cyan-500/30 mt-1 shadow-inner">
                              {hText}
                            </div>
                          ) : (
                            <div className="text-[10px] text-slate-500 italic mt-0.5 flex justify-between">
                              <span>Orientação da Missão {currentMissionIndex + 1}</span>
                              <span className="text-[#FF3366] font-semibold">-{cost} {cost === 1 ? 'ponto' : 'pontos'}</span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="flex-1 flex flex-col min-h-0 bg-slate-900/60 border border-slate-700/60 rounded-lg overflow-hidden backdrop-blur-md">
                  <div className="grid grid-cols-3 border-b border-slate-800 bg-slate-950/60 text-xs font-mono">
                    <button onClick={() => { sound.playClick(); setRefTab('table'); }} className={`py-2 px-1 text-center cursor-pointer ${refTab === 'table' ? 'border-b-2 border-cyan-400 text-cyan-300 bg-cyan-950/20' : 'text-slate-400'}`}>Tabela</button>
                    <button onClick={() => { sound.playClick(); setRefTab('formulas'); }} className={`py-2 px-1 text-center cursor-pointer ${refTab === 'formulas' ? 'border-b-2 border-cyan-400 text-cyan-300 bg-cyan-950/20' : 'text-slate-400'}`}>Fórmulas</button>
                    <button onClick={() => { sound.playClick(); setRefTab('nox'); }} className={`py-2 px-1 text-center cursor-pointer ${refTab === 'nox' ? 'border-b-2 border-cyan-400 text-cyan-300 bg-cyan-950/20' : 'text-slate-400'}`}>NOX</button>
                  </div>
                  <div className="flex-1 p-2 overflow-y-auto custom-scrollbar">
                    {refTab === 'table' && (
                      <div className="flex flex-col gap-2">
                        <input type="text" placeholder="Filtrar por nome ou símbolo..." value={refSearch} onChange={e => setRefSearch(e.target.value)} className="w-full px-2 py-1 text-xs bg-slate-950 border border-slate-700 rounded text-slate-200 font-mono focus:outline-none" />
                        <div className="grid grid-cols-2 gap-1.5">
                          {PERIODIC_ELEMENTS.filter(e => e.name.toLowerCase().includes(refSearch.toLowerCase()) || e.symbol.toLowerCase().includes(refSearch.toLowerCase()) || e.z.toString() === refSearch.trim()).map(el => (
                            <div key={el.z} className="bg-slate-950/80 border border-slate-800 p-1.5 rounded flex justify-between items-center">
                              <div className="flex items-center gap-1.5">
                                <div className="w-6 h-6 rounded bg-slate-900 border border-slate-700 flex items-center justify-center font-bold text-xs text-cyan-300">{el.symbol}</div>
                                <div><div className="text-[11px] font-bold text-slate-200 truncate max-w-[65px]">{el.name}</div><div className="text-[9px] text-slate-500">Z={el.z}</div></div>
                              </div>
                              <span className="text-xs text-amber-300 font-mono font-bold">{el.mass}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {refTab === 'formulas' && (
                      <div className="flex flex-col gap-2">
                        {FORMULAS_DATA.map(cat => (
                          <div key={cat.cat} className="bg-slate-950/70 border border-slate-800 rounded p-2">
                            <span className="text-[11px] font-orbitron font-bold text-cyan-400 block mb-1">{cat.cat}</span>
                            {cat.items.map(it => (
                              <div key={it.name} className="mb-1 text-xs"><span className="text-slate-400 text-[10px]">{it.name}: </span><div className="font-mono text-emerald-300 bg-slate-900 px-1 py-0.5 rounded mt-0.5">{it.form}</div></div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}
                    {refTab === 'nox' && (
                      <div className="flex flex-col gap-1.5">
                        <div className="text-[10px] text-cyan-300 bg-cyan-950/30 border border-cyan-800/40 p-2 rounded font-mono">💡 Em uma espécie neutra, a soma algébrica dos NOX de todos os átomos é igual a ZERO.</div>
                        {NOX_RULES.map(r => (
                          <div key={r.rule} className="bg-slate-950/70 border border-slate-800 p-1.5 rounded flex justify-between"><span className="text-xs text-slate-200">{r.rule}</span><span className="text-xs font-mono text-cyan-300 bg-slate-900 px-1.5 rounded">{r.val}</span></div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </aside>
            </main>

            {/* Modal de Desbloqueio Coletivo Orbital (Sem botão de auto-preenchimento) */}
            {showCollectiveModal && (
              <div className="fixed inset-0 z-50 bg-[#090D16]/95 backdrop-blur-xl flex items-center justify-center p-4 select-none">
                <div className="max-w-2xl w-full bg-slate-950 border-2 border-cyan-500/60 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="font-orbitron font-extrabold text-lg text-white">DESBLOQUEIO COLETIVO DO SIMULADOR</h2>
                      <p className="text-xs text-slate-400 font-mono">O Simulador de Lançamento exige os Códigos Mestres (NOX) corretos das 8 bancadas (G1 a G8)</p>
                    </div>
                    <button onClick={() => setShowCollectiveModal(false)} className="text-xs text-slate-400 hover:text-white font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-700 cursor-pointer">Fechar</button>
                  </div>

                  <div className="bg-gradient-to-r from-cyan-950/50 via-slate-900/60 to-cyan-950/50 border border-cyan-500/40 rounded-xl p-3 text-center">
                    <span className="text-[11px] font-mono uppercase text-cyan-400 block mb-1">CÓDIGO MESTRE DA SUA EQUIPE ({group.name}):</span>
                    {completedMissions[4] ? (
                      <>
                        <div className="font-orbitron font-black text-3xl text-cyan-300">{NOX_MASTER_CODES[group.id]}</div>
                        <span className="text-[10px] text-slate-400 font-mono mt-1 block">Apresente este código para a turma e colete os códigos descobertos pelos outros grupos!</span>
                      </>
                    ) : (
                      <div className="font-mono text-xs text-amber-300 py-1">
                        🔒 Conclua a <strong>Missão 5 (NOX)</strong> da sua bancada para revelar seu Código Mestre!
                      </div>
                    )}
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-xs font-mono text-slate-300 mb-2">
                      <span>INSIRA O CÓDIGO APRESENTADO POR CADA GRUPO (G1 A G8):</span>
                      <span className="text-[10px] text-amber-400">Verificação Obrigatória</span>
                    </div>
                    <div className="grid grid-cols-4 gap-2.5">
                      {GROUPS.map(g => (
                        <div key={g.id} className={`p-2.5 rounded-lg border ${g.id === group.id ? 'bg-cyan-950/40 border-cyan-400 shadow-[0_0_10px_rgba(0,240,255,0.15)]' : 'bg-slate-900/80 border-slate-800'}`}>
                          <div className="flex justify-between text-[11px] font-mono mb-1">
                            <span className="font-bold text-slate-200">{g.id}</span>
                            <span className="text-slate-400 text-[10px]">{g.element}</span>
                          </div>
                          <input
                            type="text"
                            placeholder="Código"
                            value={collectiveCodes[g.id] || ''}
                            onChange={e => {
                              setCollectiveError(null);
                              setCollectiveCodes(c => ({ ...c, [g.id]: e.target.value }));
                            }}
                            className={`w-full text-center py-1.5 font-mono font-bold text-sm rounded bg-slate-950 border ${g.id === group.id ? 'border-cyan-400 text-cyan-300' : 'border-slate-700 text-slate-100'} focus:outline-none focus:border-[#00F0FF]`}
                          />
                        </div>
                      ))}
                    </div>
                  </div>

                  {collectiveError && (
                    <div className="bg-rose-950/80 border border-[#FF3366] rounded-lg p-2.5 text-rose-200 text-xs font-mono">
                      ⚠️ {collectiveError}
                    </div>
                  )}

                  <button onClick={() => {
                    sound.playClick();
                    if (!completedMissions.every(Boolean)) {
                      sound.playError();
                      setCollectiveError(`Sua bancada (${group.id}) precisa concluir todas as 6 missões antes de liberar o Simulador (${completedMissions.filter(Boolean).length}/6 concluídas).`);
                      return;
                    }
                    const wrongGroups = [];
                    for (let gid of Object.keys(NOX_MASTER_CODES)) {
                      let uVal = (collectiveCodes[gid] || '').trim().replace(/\s+/g, '');
                      if (!uVal.startsWith('+') && !uVal.startsWith('-') && uVal !== '' && !isNaN(Number(uVal)) && Number(uVal) > 0) {
                        uVal = `+${uVal}`;
                      }
                      if (uVal !== NOX_MASTER_CODES[gid]) {
                        wrongGroups.push(gid);
                      }
                    }
                    if (wrongGroups.length === 0) {
                      sound.playSuccess();
                      setSimulatorUnlocked(true);
                      setShowCollectiveModal(false);
                      setShowSimulator(true);
                    } else {
                      sound.playError();
                      setCollectiveError(`Código ausente ou incorreto nas bancadas: ${wrongGroups.join(', ')}. Confira os códigos apresentados por cada grupo!`);
                    }
                  }} className="w-full py-3 bg-gradient-to-r from-cyan-500 via-blue-600 to-emerald-500 hover:brightness-110 text-white font-orbitron font-extrabold text-sm tracking-wider rounded-xl shadow-lg shadow-cyan-950 cursor-pointer">
                    AUTORIZAR ACESSO AO SIMULADOR DE LANÇAMENTO →
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Render React 18 Application Root
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
